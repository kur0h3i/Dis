<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Dis">
  <title>Dis</title>
  <defs>
    <radialGradient id="dis-glow" cx="32" cy="28" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dis-fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="dis-core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="dis-wall" x1="0" y1="10" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="dis-rim" x1="0" y1="10" x2="0" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="dis-ember" x1="0" y1="50" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Fondo negro propio: así el logo no se ve sobre blanco en GitHub (tema claro). -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#0a0a0a"/>
  <!-- «Il foco etterno ch'entro l'affoca le dimostra rosse» (Inf. VIII, 73-74). -->
  <circle cx="32" cy="28" r="30" fill="url(#dis-glow)"/>
  <path fill="url(#dis-fire)" transform="translate(15.25 10) scale(1.05 1.05)" d="M5 0C6 4 10 7 10 12.5 10 17 7.5 20 5 20 2.5 20 0 17.5 0 13.5 0 10.5 2 9 2.5 6.5c1 2 2 2.5 2.3 1.5C5.3 6 5.2 3 5 0z"/><path fill="url(#dis-fire)" transform="translate(48.75 10) scale(-1.05 1.05)" d="M5 0C6 4 10 7 10 12.5 10 17 7.5 20 5 20 2.5 20 0 17.5 0 13.5 0 10.5 2 9 2.5 6.5c1 2 2 2.5 2.3 1.5C5.3 6 5.2 3 5 0z"/>
  <path fill="url(#dis-core)" transform="translate(17.6 19) scale(0.6 0.6)" d="M5 0C6 4 10 7 10 12.5 10 17 7.5 20 5 20 2.5 20 0 17.5 0 13.5 0 10.5 2 9 2.5 6.5c1 2 2 2.5 2.3 1.5C5.3 6 5.2 3 5 0z"/><path fill="url(#dis-core)" transform="translate(46.4 19) scale(-0.6 0.6)" d="M5 0C6 4 10 7 10 12.5 10 17 7.5 20 5 20 2.5 20 0 17.5 0 13.5 0 10.5 2 9 2.5 6.5c1 2 2 2.5 2.3 1.5C5.3 6 5.2 3 5 0z"/>
  <!-- Murallas de hierro al rojo vivo (Inf. VIII, 78). -->
  <path fill="url(#dis-wall)" stroke="url(#dis-rim)" stroke-width="1.2" stroke-linejoin="round" d="M6 50V18h3v3h4v-3h3v12h2.5v-3h4v3H25V10h3v3h2.5v-3h3v3H36v-3h3v20h2.5v-3h4v3H48V18h3v3h4v-3h3v32z"/>
  <!-- La puerta que los ángeles caídos cierran a Dante (Inf. VIII, 115-117). -->
  <path fill="url(#dis-ember)" d="M28.5 50v-8.5a3.5 3.5 0 0 1 7 0V50z"/>
  <rect x="10" y="25" width="2" height="4.5" rx="1" fill="#f97316"/>
  <rect x="52" y="25" width="2" height="4.5" rx="1" fill="#f97316"/>
  <rect x="31" y="18" width="2" height="4.5" rx="1" fill="#f97316"/>
  <!-- La laguna Estigia, que rodea la ciudad. -->
  <path fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" d="M7 55.5c3.2-2 6.3-2 9.5 0s6.3 2 9.5 0 6.3-2 9.5 0 6.3 2 9.5 0 6.3-2 9.5 0"/>
  <path fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.55" d="M12 60.5c3.2-2 6.3-2 9.5 0s6.3 2 9.5 0 6.3-2 9.5 0 6.3 2 9.5 0"/>
</svg>
