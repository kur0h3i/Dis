services:
  dis:
    build: .
    image: dis:latest
    container_name: dis
    restart: unless-stopped
    # Ajustes opcionales en un fichero .env junto a este (ver .env.example).
    ports:
      - "${DIS_PORT:-8088}:8088"
    environment:
      # Raíz del host montada abajo: de aquí salen los discos de "Recursos".
      DIS_HOST_ROOT: /hostfs
      DIS_PUBLIC_HOST: ${DIS_PUBLIC_HOST:-}
      DIS_DISKS: ${DIS_DISKS:-}
      CERBERO_URL: ${CERBERO_URL:-}
    volumes:
      # Solo lectura a nivel de fichero. OJO: el socket da acceso completo a la
      # API de Docker igualmente; Dis solo hace llamadas de lectura.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Raíz del host en solo lectura, para medir el uso de los discos.
      - /:/hostfs:ro
      # Config editable sin reconstruir la imagen; Dis la recarga sola al guardarla
      # (si tu editor sustituye el fichero, p. ej. vim: docker compose restart dis).
      - ./dis.yaml:/app/dis.yaml:ro
    mem_limit: 150m
    cpus: 0.5
    labels:
      dis.description: "Dashboard central de server-kuro"
